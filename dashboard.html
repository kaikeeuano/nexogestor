<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO GESTOR - Dashboards</title>
    <link rel="stylesheet" href="staly.css">
    <script src="notifications.js"></script>
    <script src="notify.js"></script>
</head>
<body>
    <div style="padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
            <span style="font-size: 28px;">📊</span>
            <h2 style="margin: 0;">NEXO GESTOR</h2>
        </a>
        <div id="adminLink"></div>
    </div>
    
    <main class="dashboards">
        <h1>Meus Dashboards</h1>
        <button id="createDashboard" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">✨ Criar Novo Dashboard</button>
        <button id="joinDashboard">Entrar em Dashboard Existente</button>
        <button id="createPregacoes" style="background: linear-gradient(135deg, #764ba2 0%, #667eea 100%); margin-top: 10px;">📖 Criar Dashboard de Pregações</button>

        <section style="margin-top:14px; padding:12px; border:1px solid #ddd; border-radius:8px; background:#f7f9ff;">
            <h2>💡 Dica</h2>
            <p>Crie seu próprio dashboard ou entre em um existente usando o código de acesso. Para criar, você precisará de uma <strong>chave de ativação</strong> fornecida pelo administrador.</p>
        </section>
        
        <div id="createForm" style="display: none;">
            <h2>✨ Criar Novo Dashboard</h2>
            <input type="text" id="dashboardName" placeholder="Nome do Dashboard">
            <input type="text" id="activationKey" placeholder="Chave de Ativação (NEXO-XXXXXXXX-XXXXXXXX)" style="text-transform: uppercase; margin-top: 10px;">
            <button id="submitCreate">Criar Dashboard</button>
            <button id="cancelCreate">Cancelar</button>
        </div>
        
        <div id="createPregacoesForm" style="display: none;">
            <h2>📖 Criar Dashboard de Pregações</h2>
            <input type="text" id="pregacoesDashboardName" placeholder="Nome do Dashboard (ex: Minhas Pregações)">
            <input type="text" id="pregacoesActivationKey" placeholder="Chave de Ativação (NEXO-XXXXXXXX-XXXXXXXX)" style="text-transform: uppercase; margin-top: 10px;">
            <button id="submitCreatePregacoes">Criar Dashboard de Pregações</button>
            <button id="cancelCreatePregacoes">Cancelar</button>
        </div>
        
        <div id="joinForm" style="display: none;">
            <h2>Entrar em Dashboard</h2>
            <input type="text" id="joinCode" placeholder="Código do Dashboard">
            <button id="submitJoin">Entrar</button>
            <button id="cancelJoin">Cancelar</button>
        </div>
        

        
        <div id="dashboardList"></div>
    </main>

    <script>
        // Aguarda o DOM carregar completamente
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Dashboard.html carregado - DOMContentLoaded disparado!');
            console.log('🔍 Verificando elementos...');
            console.log('Botão createDashboard:', document.getElementById('createDashboard'));
            console.log('Botão joinDashboard:', document.getElementById('joinDashboard'));
            console.log('Botão createPregacoes:', document.getElementById('createPregacoes'));
            
            const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                ? 'http://localhost:3000'
                : window.location.origin;
            const token = localStorage.getItem('token');
            
            console.log('Token:', token ? 'Presente (' + token.substring(0, 20) + '...)' : 'AUSENTE - Redirecionando para login');

            // Verifica se o usuário é admin e mostra o link
            async function checkAdmin() {
                try {
                    const response = await fetch(`${API_BASE}/admin/check`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.isAdmin) {
                            document.getElementById('adminLink').innerHTML = 
                                '<a href="admin.html" style="color: white; text-decoration: none; padding: 8px 16px; background: rgba(255,255,255,0.2); border-radius: 6px; font-weight: 500;">⚙️ Painel Admin</a>';
                        }
                    }
                } catch (error) {
                    console.log('Não é admin');
                }
            }

            async function loadDashboards() {
            console.log('🔄 Carregando dashboards...');
            console.log('Token:', token ? 'Presente' : 'Ausente');
            
            try {
                const response = await fetch(`${API_BASE}/dashboards`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                console.log('Resposta da API:', response.status, response.statusText);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }
                
                const dashboards = await response.json();
                console.log('Dashboards recebidos:', dashboards);
                
                const list = document.getElementById('dashboardList');
                list.innerHTML = '<h2>Dashboards Disponíveis</h2>';
                
                if (!dashboards || dashboards.length === 0) {
                    list.innerHTML += '<p style="color:#666;padding:20px;text-align:center;">Nenhum dashboard encontrado. Crie um novo ou entre em um existente.</p>';
                    return;
                }
                
                dashboards.forEach(dashboard => {
                    const div = document.createElement('div');
                    div.className = 'dashboard-item';

                    const h3 = document.createElement('h3');
                    h3.textContent = dashboard.name;

                    const p = document.createElement('p');
                    p.textContent = `ID: ${dashboard.code || dashboard.id}`;

                    const buttonContainer = document.createElement('div');
                    buttonContainer.style.display = 'flex';
                    buttonContainer.style.gap = '10px';
                    buttonContainer.style.marginTop = '10px';

                    const btn = document.createElement('button');
                    btn.textContent = 'Acessar';
                    btn.addEventListener('click', () => selectDashboard(dashboard.id, dashboard.type));

                    // Botão de excluir (apenas para owner)
                    if (dashboard.status === 'owner') {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = '🗑️ Excluir';
                        deleteBtn.style.backgroundColor = '#dc3545';
                        deleteBtn.style.color = 'white';
                        deleteBtn.addEventListener('click', () => deleteDashboard(dashboard.id, dashboard.name));
                        buttonContainer.appendChild(deleteBtn);
                    }

                    buttonContainer.appendChild(btn);

                    div.appendChild(h3);
                    div.appendChild(p);
                    div.appendChild(buttonContainer);

                    list.appendChild(div);
                });
                
                console.log('✅ Dashboards carregados com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao carregar dashboards:', error);
                const list = document.getElementById('dashboardList');
                list.innerHTML = '<h2>Dashboards Disponíveis</h2>';
                list.innerHTML += '<p style="color:red;padding:20px;text-align:center;">❌ Erro ao carregar dashboards. Verifique se o servidor está rodando.</p>';
                notify.error('Erro ao carregar dashboards. Verifique se o servidor está rodando.', { title: 'Erro de Conexão' });
            }
        }

        // Event Listeners para botões principais
        function setupEventListeners() {
            console.log('🔧 Configurando event listeners...');
            
            const createBtn = document.getElementById('createDashboard');
            const joinBtn = document.getElementById('joinDashboard');
            const pregacoesBtn = document.getElementById('createPregacoes');
            
            console.log('✅ Botões encontrados:');
            console.log('  createDashboard:', createBtn !== null);
            console.log('  joinDashboard:', joinBtn !== null);
            console.log('  createPregacoes:', pregacoesBtn !== null);
            
            if (createBtn) {
                console.log('✅ Adicionando listener ao createDashboard');
                createBtn.addEventListener('click', function() {
                    console.log('🎯 BOTÃO CRIAR DASHBOARD CLICADO!');
                    console.log('Mostrando formulário de criação...');
                    document.getElementById('createForm').style.display = 'block';
                    document.getElementById('joinForm').style.display = 'none';
                    document.getElementById('createPregacoesForm').style.display = 'none';
                });
            } else {
                console.error('❌ Botão createDashboard não encontrado!');
            }

            if (joinBtn) {
                console.log('✅ Adicionando listener ao joinDashboard');
                joinBtn.addEventListener('click', function() {
                    console.log('🎯 BOTÃO ENTRAR DASHBOARD CLICADO!');
                    document.getElementById('joinForm').style.display = 'block';
                    document.getElementById('createForm').style.display = 'none';
                    document.getElementById('createPregacoesForm').style.display = 'none';
                });
            } else {
                console.error('❌ Botão joinDashboard não encontrado!');
            }

            if (pregacoesBtn) {
                console.log('✅ Adicionando listener ao createPregacoes');
                pregacoesBtn.addEventListener('click', function() {
                    console.log('🎯 BOTÃO CRIAR PREGAÇÕES CLICADO!');
                    console.log('📋 Mostrando formulário de pregações...');
                    document.getElementById('createPregacoesForm').style.display = 'block';
                    document.getElementById('createForm').style.display = 'none';
                    document.getElementById('joinForm').style.display = 'none';
                    console.log('✅ Formulário exibido');
                });
            } else {
                console.error('❌ Botão createPregacoes não encontrado!');
            }
            
            // Submit Create Dashboard - REFEITO
            const submitCreateBtn = document.getElementById('submitCreate');
            if (submitCreateBtn) {
                console.log('✅ Configurando botão submitCreate');
                submitCreateBtn.onclick = async function() {
                    console.log('🚀 INICIANDO CRIAÇÃO DE DASHBOARD');
                    
                    const nameInput = document.getElementById('dashboardName');
                    const keyInput = document.getElementById('activationKey');
                    
                    if (!nameInput || !keyInput) {
                        notify.error(' Campos não encontrados!', { title: 'Erro' });
                        return;
                    }
                    
                    const name = nameInput.value.trim();
                    const activationKey = keyInput.value.trim().toUpperCase();
                    
                    console.log('📋 Dados:', { name, activationKey, hasToken: !!token });
                    
                    if (!name) {
                        notify.warning('Por favor, digite o nome do dashboard', { title: 'Campo Obrigatório' });
                        return;
                    }
                    
                    if (!activationKey) {
                        notify.warning('Por favor, digite a chave de ativação', { title: 'Campo Obrigatório' });
                        return;
                    }
                    
                    if (!token) {
                        notify.warning('Você não está logado. Redirecionando...', { title: 'Autenticação' });
                        setTimeout(() => window.location.href = 'login.html', 1500);
                        return;
                    }
                    
                    try {
                        console.log('📡 Enviando requisição...');
                        const response = await fetch(`${API_BASE}/activate-dashboard`, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ activationKey: activationKey })
                        });
                        
                        console.log('📥 Resposta:', response.status, response.statusText);
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('✅ Sucesso:', data);
                            
                            if (data.dashboard && data.dashboard.id) {
                                // Atualizar nome
                                try {
                                    await fetch(`${API_BASE}/config`, {
                                        method: 'PUT',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': `Bearer ${token}`,
                                            'dashboard-id': data.dashboard.id
                                        },
                                        body: JSON.stringify({ name: name })
                                    });
                                } catch (e) {
                                    console.warn('Erro ao atualizar nome:', e);
                                }
                                
                                notify.success(`Dashboard "${name}" criado com sucesso!\nCódigo: ${data.dashboard.code}`, { title: 'Sucesso', duration: 3000 });
                                localStorage.setItem('dashboardId', data.dashboard.id);
                                setTimeout(() => window.location.href = 'sitem.html', 1500);
                            }
                        } else {
                            const error = await response.json().catch(() => ({ error: 'Erro desconhecido' }));
                            console.error('❌ Erro:', error);
                            notify.error(error.error || 'Não foi possível criar o dashboard', { title: 'Erro' });
                        }
                    } catch (error) {
                        console.error('❌ Exceção:', error);
                        notify.error('Erro de conexão com o servidor. Verifique se está rodando.', { title: 'Erro de Conexão' });
                    }
                };
            } else {
                console.error('❌ Botão submitCreate não encontrado!');
            }
            
            // Cancel Create - SIMPLIFICADO
            const cancelCreateBtn = document.getElementById('cancelCreate');
            if (cancelCreateBtn) {
                console.log('✅ Configurando botão cancelCreate');
                cancelCreateBtn.onclick = function() {
                    console.log('❌ Cancelando criação');
                    document.getElementById('createForm').style.display = 'none';
                    document.getElementById('dashboardName').value = '';
                    document.getElementById('activationKey').value = '';
                };
            }
            
            // Submit Create Pregacoes
            const submitPregacoesBtn = document.getElementById('submitCreatePregacoes');
            if (submitPregacoesBtn) {
                submitPregacoesBtn.addEventListener('click', async () => {
                    const name = document.getElementById('pregacoesDashboardName').value.trim();
                    const activationKey = document.getElementById('pregacoesActivationKey').value.trim().toUpperCase();
                    
                    console.log('🔥 Botão de pregações clicado!', { name, activationKey });
                    
                    if (!name) {
                        notify.warning('Por favor, digite o nome do dashboard', { title: 'Campo Obrigatório' });
                        return;
                    }
                    
                    if (!activationKey) {
                        notify.warning('Por favor, digite a chave de ativação', { title: 'Campo Obrigatório' });
                        return;
                    }
                    
                    notify.info('Criando dashboard de pregações...', { title: 'Processando' });
                    
                    try {
                        console.log('📡 Enviando requisição para:', `${API_BASE}/activate-dashboard`);
                        const response = await fetch(`${API_BASE}/activate-dashboard`, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ 
                                activationKey: activationKey
                            })
                        });
                        
                        console.log('📥 Resposta recebida:', response.status);
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('✅ Dados:', data);
                            
                            // Atualiza o nome e tipo do dashboard
                            if (data.dashboard && data.dashboard.id) {
                                try {
                                    console.log('🔄 Atualizando nome e tipo...');
                                    await fetch(`${API_BASE}/config`, {
                                        method: 'PUT',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': `Bearer ${token}`,
                                            'dashboard-id': data.dashboard.id
                                        },
                                        body: JSON.stringify({ name: name, type: 'pregacoes' })
                                    });
                                    console.log('✅ Nome e tipo atualizados');
                                } catch (err) {
                                    console.error('Erro ao atualizar dashboard:', err);
                                }
                            }
                            
                            notify.success(`Dashboard de Pregações "${name}" criado com sucesso!`, { 
                                title: 'Dashboard Criado',
                                duration: 3000
                            });
                            localStorage.setItem('dashboardId', data.dashboard.id);
                            console.log('🚀 Redirecionando para pregacoes.html...');
                            setTimeout(() => window.location.href = 'pregacoes.html?dashboardId=' + data.dashboard.id, 1500);
                        } else {
                            const error = await response.json().catch(() => ({}));
                            console.error('❌ Erro do servidor:', error);
                            notify.error(error.error || 'Erro ao criar dashboard', { title: 'Erro' });
                        }
                    } catch (error) {
                        console.error('❌ Erro de conexão:', error);
                        notify.error('Erro ao conectar com o servidor', { title: 'Erro de Conexão' });
                    }
                });
            } else {
                console.error('❌ Botão submitCreatePregacoes NÃO encontrado!');
            }
            
            // Cancel Create Pregacoes
            const cancelPregacoesBtn = document.getElementById('cancelCreatePregacoes');
            if (cancelPregacoesBtn) {
                cancelPregacoesBtn.addEventListener('click', () => {
                    document.getElementById('createPregacoesForm').style.display = 'none';
                    document.getElementById('pregacoesDashboardName').value = '';
                    document.getElementById('pregacoesActivationKey').value = '';
                });
            }
            
            // Submit Join
            const submitJoinBtn = document.getElementById('submitJoin');
            if (submitJoinBtn) {
                submitJoinBtn.addEventListener('click', async () => {
                    const code = document.getElementById('joinCode').value;
                    
                    if (!code.trim()) {
                        notify.warning('Por favor, digite o código do dashboard', { title: 'Campo Obrigatório' });
                        return;
                    }
                    
                    console.log('🔑 Entrando no dashboard com código:', code);
                    
                    try {
                        const response = await fetch(`${API_BASE}/dashboards/join`, {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ code })
                        });
                        
                        console.log('Resposta:', response.status);
                        const data = await response.json();
                        console.log('Dados:', data);
                        
                        if (response.ok) {
                            // Verificar se já foi aprovado automaticamente
                            if (data.autoApproved) {
                                notify.success('Você entrou no dashboard com sucesso!', { 
                                    title: 'Acesso Concedido',
                                    duration: 3000
                                });
                                // Recarregar dashboards e selecionar automaticamente
                                await loadDashboards();
                                setTimeout(() => {
                                    if (data.dashboardId) {
                                        localStorage.setItem('dashboardId', data.dashboardId);
                                        window.location.href = 'sitem.html';
                                    }
                                }, 1500);
                            } else {
                                notify.success('Solicitação enviada! Aguarde a aprovação do administrador do dashboard.', { 
                                    title: 'Solicitação Enviada',
                                    duration: 6000
                                });
                            }
                            document.getElementById('joinForm').style.display = 'none';
                            document.getElementById('joinCode').value = '';
                        } else {
                            console.error('❌ Erro:', data);
                            if (response.status === 404) {
                                notify.error('Dashboard não encontrado. Verifique o código digitado.', { title: 'Não Encontrado' });
                            } else if (response.status === 409) {
                                notify.warning(data.error || 'Você já possui acesso a este dashboard.', { 
                                    title: 'Já tem Acesso',
                                    duration: 5000
                                });
                                // Recarregar para mostrar o dashboard
                                await loadDashboards();
                            } else {
                                notify.error(data.error || 'Erro desconhecido ao entrar no dashboard', { title: 'Erro' });
                            }
                        }
                    } catch (error) {
                        console.error('❌ Erro de conexão:', error);
                        notify.error('Erro ao conectar com o servidor', { title: 'Erro de Conexão' });
                    }
                });
            }
            
            // Cancel Join
            const cancelJoinBtn = document.getElementById('cancelJoin');
            if (cancelJoinBtn) {
                cancelJoinBtn.addEventListener('click', () => {
                    document.getElementById('joinForm').style.display = 'none';
                });
            }
        }

        // Chama a função para configurar os event listeners
        setupEventListeners();

        function selectDashboard(id, type) {
            console.log('📂 Selecionando dashboard:', { id, type });
            localStorage.setItem('dashboardId', id);
            
            // Redireciona baseado no tipo do dashboard
            if (type === 'pregacoes') {
                console.log('🎤 Redirecionando para dashboard de pregações...');
                window.location.href = 'pregacoes.html';
            } else {
                console.log('📊 Redirecionando para dashboard padrão...');
                window.location.href = 'sitem.html';
            }
        }

        async function deleteDashboard(id, name) {
            if (!confirm(`Tem certeza que deseja excluir o dashboard "${name}"?\n\nEsta ação não pode ser desfeita e todos os dados serão perdidos.`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/dashboards/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    notify.success('Dashboard excluído com sucesso!');
                    await loadDashboards();
                } else {
                    const error = await response.json().catch(() => ({}));
                    notify.error(error.error || 'Erro ao excluir dashboard', { title: 'Erro' });
                }
            } catch (error) {
                console.error('Erro ao excluir dashboard:', error);
                notify.error('Erro ao conectar com o servidor', { title: 'Erro de Conexão' });
            }
        }

        if (!token) {
            window.location.href = 'login.html';
        } else {
            checkAdmin();
            loadDashboards();
        }
        
        }); // Fim do DOMContentLoaded
    </script>
</body>
</html>
