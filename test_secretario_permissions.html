<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Permissões Secretário</title>
    <script src="permissions.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        button {
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <h1>🧪 Teste de Permissões - Secretário</h1>
    
    <div class="info test-result">
        <strong>ℹ️ Instruções:</strong><br>
        1. Faça login como usuário com role "secretario"<br>
        2. Clique no botão de teste abaixo<br>
        3. Verifique se as permissões estão corretas
    </div>

    <div id="currentUser" class="test-result info">
        Carregando informações do usuário...
    </div>

    <button onclick="runTests()">▶️ Executar Testes</button>
    <button onclick="clearStorage()">🗑️ Limpar Cache</button>

    <div id="results"></div>

    <script>
        const permissionManager = new PermissionManager();

        // Display current user info
        async function displayUserInfo() {
            await permissionManager.loadUserRole();
            const role = permissionManager.getRole();
            const isOwner = permissionManager.checkIsOwner();
            
            document.getElementById('currentUser').innerHTML = `
                <strong>👤 Usuário Atual:</strong><br>
                Role: <strong>${role}</strong><br>
                Is Owner: <strong>${isOwner}</strong><br>
                Token: ${localStorage.getItem('token') ? '✅ Presente' : '❌ Ausente'}<br>
                Dashboard ID: ${localStorage.getItem('dashboardId') || '❌ Ausente'}
            `;
        }

        function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>📊 Resultados dos Testes:</h2>';

            const tests = [
                {
                    name: 'Secretário pode editar módulo Membros',
                    run: () => permissionManager.canEdit('membros'),
                    expected: true,
                    module: 'membros'
                },
                {
                    name: 'Secretário pode editar módulo DrivFotos',
                    run: () => permissionManager.canEdit('drivfotos'),
                    expected: true,
                    module: 'drivfotos'
                },
                {
                    name: 'Secretário pode editar módulo DrivDoc',
                    run: () => permissionManager.canEdit('drivdoc'),
                    expected: true,
                    module: 'drivdoc'
                },
                {
                    name: 'Secretário NÃO pode editar módulo Financeiro',
                    run: () => permissionManager.canEdit('financeiro'),
                    expected: false,
                    module: 'financeiro'
                }
            ];

            const currentRole = permissionManager.getRole();
            
            if (currentRole !== 'secretario' && !permissionManager.checkIsOwner()) {
                results.innerHTML += `
                    <div class="error test-result">
                        <strong>⚠️ Aviso:</strong> Você não está logado como secretário.<br>
                        Role atual: <strong>${currentRole}</strong><br>
                        Para testar corretamente, faça login como um usuário com role "secretario"
                    </div>
                `;
            }

            tests.forEach(test => {
                const result = test.run();
                const passed = result === test.expected;
                
                const testDiv = document.createElement('div');
                testDiv.className = `test-result ${passed ? 'success' : 'error'}`;
                testDiv.innerHTML = `
                    <strong>${passed ? '✅' : '❌'} ${test.name}</strong><br>
                    Módulo: ${test.module}<br>
                    Esperado: ${test.expected}<br>
                    Obtido: ${result}<br>
                    Status: ${passed ? 'PASSOU' : 'FALHOU'}
                `;
                results.appendChild(testDiv);
            });

            // Test applyRestrictions
            const restrictionsDiv = document.createElement('div');
            restrictionsDiv.innerHTML = '<h3>🔒 Teste de Aplicação de Restrições:</h3>';
            results.appendChild(restrictionsDiv);

            console.log('=== TESTE: Aplicando restrições para módulo membros ===');
            permissionManager.applyRestrictions('membros');
            
            const restrictionResult = document.createElement('div');
            restrictionResult.className = 'test-result info';
            restrictionResult.innerHTML = `
                <strong>ℹ️ Restrições Aplicadas</strong><br>
                Verifique o console do navegador para ver os logs detalhados.<br>
                Se você é secretário, NENHUMA restrição deve ter sido aplicada ao módulo membros.
            `;
            results.appendChild(restrictionResult);
        }

        function clearStorage() {
            localStorage.removeItem('userRole');
            localStorage.removeItem('isOwner');
            alert('Cache de permissões limpo! Recarregue a página.');
        }

        // Auto-load user info
        displayUserInfo();
    </script>
</body>
</html>
