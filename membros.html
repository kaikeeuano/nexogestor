<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXO GESTOR - Membros</title>
    <link rel="icon" type="image/x-icon" href="uploads/favicon.ico">
    <link rel="stylesheet" href="staly.css">
    <script src="permissions.js"></script>
    <script src="notify.js"></script>
    <style>
        .main-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin-bottom: 0;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: white;
        }
        .logo-link img { border-radius: 8px; background: #fff; padding: 2px; }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo-link">
            <img src="uploads/logo.png" alt="Logo NEXO GESTOR" style="height:40px;vertical-align:middle;margin-right:10px;">
            <span style="font-size: 28px; vertical-align: middle;">👥</span>
            <h2 style="display:inline; margin: 0 0 0 8px; font-size: 20px; vertical-align: middle;">NEXO GESTOR</h2>
        </a>
    </header>
    <nav class="nav-list">
        <li class="nav-item"><a href="sitem.html">Dashboard</a></li>
        <li class="nav-item"><a href="gestao.html">Gestão</a></li>
        <li class="nav-item"><a href="agenda.html">Agenda</a></li>
        <li class="nav-item"><a href="projetos.html">Projetos</a></li>
        <li class="nav-item"><a href="membros.html" class="active">Membros</a></li>
        <li class="nav-item"><a href="relatorios.html">Relatórios</a></li>
        <li class="nav-item"><a href="financeiro.html">Financeiro</a></li>
        <li class="nav-item"><a href="drivfotos.html">Fotos</a></li>
        <li class="nav-item"><a href="drivdoc.html">Documentos</a></li>
        <li class="nav-item"><a href="configuracao.html">Configurações</a></li>
        <li class="nav-item"><button id="logout">Sair</button></li>
    </nav>
    <main class="membros">
        <h1>Membros</h1>
        <div class="actions">
            <button id="addMemberBtn">Adicionar Membro</button>
            <button id="printButton">Imprimir Lista</button>
            <input type="text" id="searchName" placeholder="Buscar por nome">
            <select id="filterCongregation"><option value="">Todas as Congregações</option></select>
            <select id="filterCargo"><option value="">Todos os Cargos</option></select>
        </div>
        <table id="membersTable">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Congregação</th>
                    <th>Cargo</th>
                    <th>Data de Nascimento</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="membersBody"></tbody>
        </table>
        <div id="memberModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Adicionar Membro</h2>
                <form id="memberForm">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" required>
                    <label for="congregation">Congregação:</label>
                    <select id="congregation" required><option value="">Selecione</option></select>
                    <label for="cargo">Cargo:</label>
                    <select id="cargo" required><option value="">Selecione</option></select>
                    <label for="birthDate">Data de Nascimento:</label>
                    <input type="date" id="birthDate">
                    <label for="photo">Foto:</label>
                    <input type="file" id="photo" accept="image/*">
                    <button type="button" id="submitMember">Salvar</button>
                    <button type="button" id="cancelMember">Cancelar</button>
                </form>
            </div>
        </div>
        <div id="printModal" class="modal" style="display:none;">
            <div class="modal-content">
                <span class="close-print">&times;</span>
                <h2>Imprimir Lista de Membros</h2>
                <label for="printFilterType">Filtrar por:</label>
                <select id="printFilterType">
                    <option value="all">Todos</option>
                    <option value="congregation">Congregação</option>
                    <option value="cargo">Cargo</option>
                </select>
                <div id="printFilterValueGroup" style="display:none;">
                    <label for="printFilterValue">Selecione:</label>
                    <select id="printFilterValue"></select>
                </div>
                <button type="button" id="confirmPrintBtn">Imprimir</button>
                <button type="button" id="cancelPrintBtn">Cancelar</button>
            </div>
        </div>
    </main>
    <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000'
        : window.location.origin;
    const API_URL = `${API_BASE}/members`;
    const CONFIG_CONG_URL = `${API_BASE}/config/congregations`;
    const CONFIG_ROLES_URL = `${API_BASE}/config/roles`;
    const token = localStorage.getItem('token');
    const dashboardId = localStorage.getItem('dashboardId');
    let allMembers = [];
    let congregationsList = [];
    let rolesList = [];
    let editingMember = null;
    let dashboardConfig = {};
    async function getDashboardConfig() {
        try {
            const response = await fetch(`${API_BASE}/config`, {
                headers: { 'Authorization': `Bearer ${token}`, 'dashboard-id': dashboardId }
            });
            if (!response.ok) return {};
            dashboardConfig = await response.json();
            return dashboardConfig;
        } catch (e) { return {}; }
    }
    async function loadCongregations() {
        await getDashboardConfig();
        const select = document.getElementById('congregation');
        const filterSelect = document.getElementById('filterCongregation');
        if (dashboardConfig.isSubDashboard && dashboardConfig.restrictedCongregation) {
            select.innerHTML = '';
            const opt = document.createElement('option');
            opt.value = dashboardConfig.restrictedCongregation;
            opt.textContent = dashboardConfig.restrictedCongregation;
            opt.selected = true;
            select.appendChild(opt);
            select.disabled = true;
            filterSelect.innerHTML = `<option value='${dashboardConfig.restrictedCongregation}'>${dashboardConfig.restrictedCongregation}</option>`;
        } else {
            try {
                const response = await fetch(CONFIG_CONG_URL, {
                    headers: { 'Authorization': `Bearer ${token}`, 'dashboard-id': dashboardId }
                });
                const congregations = await response.json();
                congregationsList = Array.isArray(congregations) ? congregations : [];
                select.innerHTML = '<option value="">Selecione</option>';
                filterSelect.innerHTML = '<option value="">Todas as Congregações</option>';
                congregationsList.forEach(cong => {
                    const opt = document.createElement('option');
                    opt.value = cong.name;
                    opt.textContent = cong.name;
                    select.appendChild(opt);
                    const filterOpt = document.createElement('option');
                    filterOpt.value = cong.name;
                    filterOpt.textContent = cong.name;
                    filterSelect.appendChild(filterOpt);
                });
            } catch (err) {
                notify.error('Erro ao carregar congregações');
            }
        }
    }
    async function loadRoles() {
        try {
            const response = await fetch(CONFIG_ROLES_URL, {
                headers: { 'Authorization': `Bearer ${token}`, 'dashboard-id': dashboardId }
            });
            const roles = await response.json();
            rolesList = Array.isArray(roles) ? roles : [];
            const select = document.getElementById('cargo');
            select.innerHTML = '<option value="">Selecione</option>';
            const filterSelect = document.getElementById('filterCargo');
            filterSelect.innerHTML = '<option value="">Todos os Cargos</option>';
            rolesList.forEach(role => {
                const opt = document.createElement('option');
                opt.value = role.name;
                opt.textContent = role.name;
                select.appendChild(opt);
                const filterOpt = document.createElement('option');
                filterOpt.value = role.name;
                filterOpt.textContent = role.name;
                filterSelect.appendChild(filterOpt);
            });
        } catch (err) {
            notify.error('Erro ao carregar cargos');
        }
    }
    async function loadMembers() {
        try {
            const response = await fetch(API_URL, {
                headers: { 'Authorization': `Bearer ${token}`, 'dashboard-id': dashboardId }
            });
            const members = await response.json();
            allMembers = Array.isArray(members) ? members : [];
            displayMembers(allMembers);
        } catch (err) {
            notify.error('Erro ao carregar membros');
        }
    }
    function displayMembers(members) {
        const tbody = document.getElementById('membersBody');
        tbody.innerHTML = '';
        members.forEach(member => {
            const row = document.createElement('tr');
            const photoTd = document.createElement('td');
            if (member.photo) {
                const img = document.createElement('img');
                img.src = `/uploads/${member.photo}`;
                img.alt = 'Foto';
                img.style.maxWidth = '60px';
                img.style.borderRadius = '8px';
                photoTd.appendChild(img);
            } else {
                photoTd.textContent = 'Sem foto';
            }
            const nameTd = document.createElement('td');
            nameTd.textContent = member.name;
            const congTd = document.createElement('td');
            congTd.textContent = member.congregation;
            const cargoTd = document.createElement('td');
            cargoTd.textContent = member.cargo || '';
            const birthTd = document.createElement('td');
            birthTd.textContent = member.birth_date || '';
            const actionsTd = document.createElement('td');
            const editBtn = document.createElement('button');
            editBtn.textContent = 'Editar';
            editBtn.onclick = () => openModal('Editar Membro', member);
            actionsTd.appendChild(editBtn);
            row.appendChild(photoTd);
            row.appendChild(nameTd);
            row.appendChild(congTd);
            row.appendChild(cargoTd);
            row.appendChild(birthTd);
            row.appendChild(actionsTd);
            tbody.appendChild(row);
        });
    }
    function openModal(title, member = null) {
        editingMember = member;
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('memberModal').style.display = 'block';
        if (dashboardConfig.isSubDashboard && dashboardConfig.restrictedCongregation) {
            document.getElementById('congregation').value = dashboardConfig.restrictedCongregation;
            document.getElementById('congregation').disabled = true;
        } else {
            document.getElementById('congregation').disabled = false;
        }
        if (member) {
            document.getElementById('name').value = member.name;
            document.getElementById('congregation').value = member.congregation;
            document.getElementById('cargo').value = member.cargo || '';
            document.getElementById('birthDate').value = member.birth_date || '';
        } else {
            document.getElementById('memberForm').reset();
            if (dashboardConfig.isSubDashboard && dashboardConfig.restrictedCongregation) {
                document.getElementById('congregation').value = dashboardConfig.restrictedCongregation;
            }
        }
    }
    function closeModal() {
        document.getElementById('memberModal').style.display = 'none';
        editingMember = null;
    }
    async function saveMember() {
        const name = document.getElementById('name').value;
        let congregation = document.getElementById('congregation').value;
        const cargo = document.getElementById('cargo').value;
        const birthDate = document.getElementById('birthDate').value;
        const photo = document.getElementById('photo').files[0];
        if (dashboardConfig.isSubDashboard && dashboardConfig.restrictedCongregation) {
            congregation = dashboardConfig.restrictedCongregation;
        }
        if (!name || !congregation || !cargo) {
            notify.warning('Preencha todos os campos obrigatórios');
            return;
        }
        const formData = new FormData();
        formData.append('name', name);
        formData.append('congregation', congregation);
        formData.append('cargo', cargo);
        formData.append('birth_date', birthDate);
        if (photo) formData.append('photo', photo);
        let url = API_URL;
        let method = 'POST';
        if (editingMember) {
            url = `${API_URL}/${editingMember.id}`;
            method = 'PUT';
        }
        try {
            const response = await fetch(url, {
                method,
                headers: { 'Authorization': `Bearer ${token}`, 'dashboard-id': dashboardId },
                body: formData
            });
            if (!response.ok) {
                notify.error('Erro ao salvar membro');
                return;
            }
            notify.success(editingMember ? 'Membro atualizado!' : 'Membro adicionado!');
            closeModal();
            loadMembers();
        } catch (err) {
            notify.error('Erro ao salvar membro');
        }
    }
    function applyFilters() {
        const nameVal = document.getElementById('searchName').value.toLowerCase();
        const congVal = document.getElementById('filterCongregation').value;
        const cargoVal = document.getElementById('filterCargo').value;
        let filtered = allMembers.filter(m => {
            const matchName = !nameVal || m.name.toLowerCase().includes(nameVal);
            const matchCong = !congVal || m.congregation === congVal;
            const matchCargo = !cargoVal || m.cargo === cargoVal;
            return matchName && matchCong && matchCargo;
        });
        displayMembers(filtered);
    }
    document.getElementById('searchName').oninput = applyFilters;
    document.getElementById('filterCongregation').onchange = applyFilters;
    document.getElementById('filterCargo').onchange = applyFilters;
    document.getElementById('addMemberBtn').onclick = () => openModal('Adicionar Membro');
    document.getElementById('submitMember').onclick = saveMember;
    document.getElementById('cancelMember').onclick = closeModal;
    document.querySelector('.close').onclick = closeModal;
    document.getElementById('logout').onclick = function() {
        localStorage.removeItem('token');
        localStorage.removeItem('dashboardId');
        window.location.href = 'login.html';
    };
    async function openPrintModal() {
        document.getElementById('printModal').style.display = 'block';
        document.getElementById('printFilterType').value = 'all';
        document.getElementById('printFilterValueGroup').style.display = 'none';
    }
    function closePrintModal() {
        document.getElementById('printModal').style.display = 'none';
    }
    document.getElementById('printButton').onclick = openPrintModal;
    document.getElementById('cancelPrintBtn').onclick = closePrintModal;
    document.querySelector('.close-print').onclick = closePrintModal;
    document.getElementById('printFilterType').onchange = function() {
        const type = this.value;
        const filterGroup = document.getElementById('printFilterValueGroup');
        const select = document.getElementById('printFilterValue');
        select.innerHTML = '';
        if (type === 'all') {
            filterGroup.style.display = 'none';
        } else if (type === 'congregation') {
            filterGroup.style.display = 'block';
            congregationsList.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.name;
                opt.textContent = c.name;
                select.appendChild(opt);
            });
        } else if (type === 'cargo') {
            filterGroup.style.display = 'block';
            rolesList.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.name;
                opt.textContent = r.name;
                select.appendChild(opt);
            });
        }
    };
    document.getElementById('confirmPrintBtn').onclick = async function() {
        const type = document.getElementById('printFilterType').value;
        const value = document.getElementById('printFilterValue').value;
        let filteredMembers = allMembers;
        let filterText = 'Todos os Membros';
        if (type === 'congregation') {
            filteredMembers = allMembers.filter(m => m.congregation === value);
            filterText = `Congregação: ${value}`;
        } else if (type === 'cargo') {
            filteredMembers = allMembers.filter(m => m.cargo === value);
            filterText = `Cargo: ${value}`;
        }
        let rowsHtml = '';
        filteredMembers.forEach(m => {
            const birthDate = m.birth_date ? new Date(m.birth_date).toLocaleDateString('pt-BR') : '';
            rowsHtml += `<tr>
                <td>${m.name || ''}</td>
                <td>${m.congregation || ''}</td>
                <td>${m.cargo || ''}</td>
                <td>${birthDate}</td>
            </tr>`;
        });
        // Buscar config do dashboard
        const config = await getDashboardConfig();
        const logoSrc = config.logo ? `${API_BASE}/uploads/${config.logo}` : 'uploads/logo.png';
        const dashName = config.name || 'NEXO GESTOR';
        const printHtml = `<!doctype html>
<html lang=\"pt-BR\">
<head>
    <meta charset=\"utf-8\">
    <title>Lista de Membros</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; padding: 20px; }
        .print-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #333; }
        .print-header img { max-height: 80px; margin-bottom: 10px; }
        .print-header h2 { margin: 10px 0; color: #333; }
        .print-header h3 { margin: 5px 0; color: #666; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f0f0f0; padding: 10px; text-align: left; border: 1px solid #ddd; font-weight: bold; }
        td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .watermark { position: fixed; bottom: 10px; left: 0; width: 100%; text-align: center; color: #bbb; font-size: 14px; opacity: 0.5; pointer-events: none; }
        @media print { body { padding: 0; } @page { margin: 1cm; } .watermark { position: fixed; bottom: 10px; } }
    </style>
</head>
<body>
    <div class=\"print-header\">
        <img src=\"${logoSrc}\" alt=\"Logo\">
        <h2>${dashName}</h2>
        <h3>Lista de Membros</h3>
        <p><strong>Filtro:</strong> ${filterText}</p>
        <p><strong>Total:</strong> ${filteredMembers.length} membros</p>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Congregação</th>
                <th>Cargo</th>
                <th>Data Nasc.</th>
            </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
    </table>
    <div class=\"watermark\">NEXO GESTOR - Sistema de Gestão</div>
</body>
</html>`;
        closePrintModal();
        const printWindow = window.open('', '_blank', 'width=800,height=600');
        if (!printWindow) {
            notify.error('Popup bloqueado! Por favor, permita popups para este site.');
            return;
        }
        printWindow.document.open();
        printWindow.document.write(printHtml);
        printWindow.document.close();
        printWindow.focus();
        setTimeout(() => { printWindow.print(); }, 500);
    };
    loadCongregations();
    loadRoles();
    loadMembers();
    </script>
    <script src="mobile-menu.js"></script>
</body>
</html>
